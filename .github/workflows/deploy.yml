name: CI / CD — Frontend

on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging, develop]

# Branch → environment mapping:
#   develop → CI only (dev is local; no cloud deploy)
#   staging → Cloudflare Pages (staging.freework.co.za) — talks to api-staging.freework.co.za
#   main    → Cloudflare Pages (freework.co.za). While the prod backend does not exist,
#             the production build runs in waitlist mode (environment.prod.ts): only the
#             waitlist + static legal pages, with sign-ups going to functions/api/waitlist.ts.

env:
  # Node 24 (npm 11) matches the version the committed package-lock.json was
  # generated with; Node 20 (npm 10) rejects the lock as out of sync. Also clears
  # the Node-20 GitHub Actions deprecation. Angular 20 supports Node 24.
  NODE_VERSION: '24'

jobs:
  # ── CI: runs on every push and PR ────────────────────────────────────────────
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run test:functions

      - name: Resolve Angular build configuration
        id: cfg
        run: |
          case "${{ github.ref }}" in
            refs/heads/main)    echo "angular_config=production" >> "$GITHUB_OUTPUT" ;;
            refs/heads/staging) echo "angular_config=staging"    >> "$GITHUB_OUTPUT" ;;
            *)                  echo "angular_config=staging"     >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Build
        run: npm run build -- --configuration ${{ steps.cfg.outputs.angular_config }}

  # ── Deploy: staging (staging → Cloudflare Pages → staging.freework.co.za) ────
  # Requires GitHub secrets (staging environment):
  #   CLOUDFLARE_API_TOKEN   — token with Account → Cloudflare Pages: Edit
  #   CLOUDFLARE_ACCOUNT_ID  — Cloudflare account id
  # The project is auto-created on first run; map staging.freework.co.za to it in
  # the Cloudflare dashboard (Pages → custom domains) once.
  deploy-staging:
    name: Deploy → Staging (Cloudflare Pages)
    needs: lint-and-build
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - run: npm run build -- --configuration staging

      - name: Ensure Cloudflare Pages project exists
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create freework-frontend-staging --production-branch=staging

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/angular-app/browser --project-name=freework-frontend-staging --branch=staging

  # ── Deploy: production (main → Cloudflare Pages → freework.co.za) ───────────
  # Requires GitHub secrets in a `production` environment (add required reviewers there
  # to gate every prod deploy):
  #   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID — same as staging
  # Waitlist function secrets live in the Pages project, not GitHub:
  #   ZOHO_CLIENT_ID, ZOHO_CLIENT_SECRET, ZOHO_REFRESH_TOKEN (+ optional ZOHO_ACCOUNTS_URL)
  # `pages deploy` runs from the repo root so it also bundles ./functions.
  # Map freework.co.za + www to the project once (Pages → custom domains).
  deploy-production:
    name: Deploy → Production (Cloudflare Pages)
    needs: lint-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Until CLOUDFLARE_API_TOKEN is added to the production environment, skip instead of
      # failing; prod is then deployed by hand with `wrangler pages deploy` (see CLAUDE.md).
      - name: Check deploy credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::production has no CLOUDFLARE_API_TOKEN; skipping the Pages deploy"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
        if: steps.creds.outputs.ready == 'true'

      - run: npm run build -- --configuration production
        if: steps.creds.outputs.ready == 'true'

      - name: Ensure Cloudflare Pages project exists
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create freework-frontend --production-branch=main

      - name: Deploy to Cloudflare Pages
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/angular-app/browser --project-name=freework-frontend --branch=main
